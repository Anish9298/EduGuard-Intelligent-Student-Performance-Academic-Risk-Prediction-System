<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduGuard- Academic Records</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="academic">
<nav>
    <span class="brand">🎓 EduGuard</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="student.html">Students</a>
    <a href="academic.html" class="active">Academic Records</a>
    <a href="#" onclick="logout()">Logout</a>
</nav>

<main>
    <section class="card">
        <h2>Select Student</h2>
        <select id="studentSelect"></select>
        <p id="msg" class="error"></p>
    </section>

    <div class="two-col">
        <section class="card">
            <h2>Add Attendance</h2>
            <form id="attForm" class="stack">
                <input id="attSubject" placeholder="Subject" required>
                <input id="attTotal" type="number" min="1" placeholder="Total classes" required>
                <input id="attAttended" type="number" min="0" placeholder="Attended classes" required>
                <button type="submit">Save Attendance</button>
            </form>
            <table>
                <thead><tr><th>Subject</th><th>Attended</th><th>Total</th><th>%</th><th></th></tr></thead>
                <tbody id="attTable"></tbody>
            </table>
        </section>

        <section class="card">
            <h2>Add Marks</h2>
            <form id="marksForm" class="stack">
                <input id="mSubject" placeholder="Subject" required>
                <select id="mExam">
                    <option>Midterm</option>
                    <option>Final</option>
                    <option>Quiz</option>
                    <option>Assignment</option>
                </select>
                <input id="mObtained" type="number" min="0" step="0.01" placeholder="Marks obtained" required>
                <input id="mMax" type="number" min="1" step="0.01" placeholder="Maximum marks" required>
                <button type="submit">Save Marks</button>
            </form>
            <table>
                <thead><tr><th>Subject</th><th>Exam</th><th>Marks</th><th>%</th><th></th></tr></thead>
                <tbody id="marksTable"></tbody>
            </table>
        </section>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
