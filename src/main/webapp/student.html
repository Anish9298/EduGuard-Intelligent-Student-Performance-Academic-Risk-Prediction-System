<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduGuard - Students</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="student">
<nav>
    <span class="brand">🎓 EduGuard</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="student.html" class="active">Students</a>
    <a href="academic.html">Academic Records</a>
    <a href="#" onclick="logout()">Logout</a>
</nav>

<main>
    <section class="card">
        <h2>Add Student</h2>
        <form id="studentForm" class="grid">
            <input id="rollNo" placeholder="Roll No (e.g. CS101)" required>
            <input id="name" placeholder="Full Name" required>
            <input id="course" placeholder="Course (e.g. B.Tech)" required>
            <input id="semester" type="number" min="1" max="12" placeholder="Semester" required>
            <button type="submit">Add Student</button>
        </form>
        <p id="msg" class="error"></p>
    </section>

    <section class="card">
        <h2>All Students</h2>
        <table>
            <thead>
            <tr><th>ID</th><th>Roll No</th><th>Name</th><th>Course</th><th>Semester</th><th>Action</th></tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
