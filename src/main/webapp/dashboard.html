<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduGuard AI - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-page="dashboard">
<nav>
    <span class="brand">🎓 EduGuard</span>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="student.html">Students</a>
    <a href="academic.html">Academic Records</a>
    <a href="#" onclick="logout()">Logout</a>
</nav>

<main>
    <section class="stats">
        <div class="stat"><span id="totalCount">0</span>Total Students</div>
        <div class="stat low"><span id="lowCount">0</span>Low Risk</div>
        <div class="stat medium"><span id="medCount">0</span>Medium Risk</div>
        <div class="stat high"><span id="highCount">0</span>High Risk</div>
    </section>

    <div class="two-col">
        <section class="card">
            <h2>Risk Distribution</h2>
            <div class="chart-box"><canvas id="riskChart"></canvas></div>
        </section>

        <section class="card">
            <h2>Student Risk Report</h2>
            <button id="refreshBtn">🔄 Recalculate Risk</button>
            <p id="msg" class="error"></p>
            <table>
                <thead>
                <tr><th>Roll No</th><th>Name</th><th>Score</th><th>Level</th><th>Reason</th></tr>
                </thead>
                <tbody id="riskTable"></tbody>
            </table>
        </section>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
